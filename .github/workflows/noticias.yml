name: 📊 Resumen Noticias Diario

# Ejecuta cada día a las 6:00 AM (Hora México CST)
# 6 AM CST = 12 UTC
on:
  schedule:
    - cron: '0 12 * * *'  # Todos los días a las 6 AM México
  workflow_dispatch:      # Permite ejecutar manualmente

jobs:
  resumen-noticias:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Instalar dependencias
        run: |
          pip install requests
      
      - name: Ejecutar script de análisis
        env:
          # Variables de entorno - Se obtienen de GitHub Secrets
          # NOTA: Sin Google TTS (sin RFC necesario)
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TU_NUMERO_WHATSAPP: ${{ secrets.TU_NUMERO_WHATSAPP }}
        run: python src/main.py
      
      - name: Notificar éxito
        if: success()
        run: |
          echo "✅ Resumen de noticias enviado exitosamente a WhatsApp"
          echo "Hora: $(date)"
      
      - name: Notificar error
        if: failure()
        run: |
          echo "❌ Error en la ejecución del script"
          echo "Hora: $(date)"
