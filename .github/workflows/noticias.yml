name: 📊 Resumen Noticias Diario

on:
  schedule:
    - cron: '0 12 * * *'  # 6 AM México
  workflow_dispatch:

jobs:
  resumen-noticias:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Instalar dependencias
        run: |
          pip install requests
      
      - name: Ejecutar script de análisis
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          TU_EMAIL_PERSONAL: ${{ secrets.TU_EMAIL_PERSONAL }}
        run: python src/main.py
      
      - name: Notificar éxito
        if: success()
        run: |
          echo "✅ Resumen de noticias enviado a email"
          echo "Hora: $(date)"
      
      - name: Notificar error
        if: failure()
        run: |
          echo "❌ Error en la ejecución"
          echo "Hora: $(date)"
