name: 📊 Resumen Noticias Diario

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  resumen-noticias:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Instalar dependencias
        run: |
          pip install requests
      
      - name: Ejecutar script
        env:
          FT_API_KEY: ${{ secrets.FT_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TU_NUMERO_WHATSAPP: ${{ secrets.TU_NUMERO_WHATSAPP }}
        run: python src/main.py
      
      - name: Notificar éxito
        if: success()
        run: echo "✅ Resumen enviado exitosamente"
      
      - name: Notificar error
        if: failure()
        run: echo "❌ Error en la ejecución"
